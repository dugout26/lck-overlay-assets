<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>LCK 룬 오버레이 — 방송 소스</title>
<style>html, body { margin: 0; height: 100%; background: #00FF00; overflow: hidden; }</style>
</head>
<body>
<script>
/* 방송 소스 모드 — OBS 브라우저 소스 또는 크로마키 창 캡처용.
   URL 옵션: ?bg=00FF00 (배경색) ?delay=-60 (방송 딜레이 초) ?match=<matchId> (경기 고정) */
window.__lckovSourceMode = true;
(function () {
  var m = location.search.match(/[?&]bg=([^&]+)/);
  if (m) document.body.style.background = "#" + decodeURIComponent(m[1]).replace(/^#/, "");
  fetch("https://raw.githubusercontent.com/dugout26/lck-overlay-assets/main/console-live.js")
    .then(function (r) { return r.text(); })
    .then(function (t) { (0, eval)(t); })
    .catch(function (e) { console.log("번들 로드 실패:", e); });
})();
</script>
</body>
</html>
